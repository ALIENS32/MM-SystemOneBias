[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-systemonebias"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["datasets>=3", "huggingface_hub>=0.26", "pyarrow>=18", "Pillow>=10", "PyYAML>=6", "numpy>=2", "pandas>=2", "scipy>=1.14", "httpx>=0.27", "tqdm>=4.66"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

